name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        run: mvn test package
      - name: Docker build
        run: docker build -t ringforge-chord-platform:ci .
